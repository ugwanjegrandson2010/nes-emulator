# Signing key for the public release APK of MilliEmu.
#
# This key is deliberately committed: the app is a free, permissionless homebrew
# emulator, and publishing the key means anyone can rebuild a release that Android
# accepts as an update of the official one. It is NOT a Play Store upload key and
# must never be used for anything else.
storeFile=keystore/milliemu-release.jks
storePassword=milliemu-release-2024
keyAlias=milliemu
keyPassword=milliemu-release-2024
