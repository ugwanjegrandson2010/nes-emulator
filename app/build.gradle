plugins {
    id 'com.android.application'
}

// Release signing. keystore.properties is committed on purpose: this app is free
// homebrew and the key is public, so anyone can rebuild an installable release.
// If the file is missing (e.g. a fork removed it), the release build is just
// unsigned and assembleDebug still works.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'emu.android'
    compileSdk 34

    defaultConfig {
        applicationId 'emu.android'
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':core')
}
